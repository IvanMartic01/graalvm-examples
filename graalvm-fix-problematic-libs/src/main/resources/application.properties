spring.application.name=fix_broken_spring_boot_graalvm

spring.threads.virtual.enabled=true

spring.datasource.url=jdbc:postgresql://localhost:5432/dummy-db
spring.datasource.username=dummy-user
spring.datasource.password=dummy-pw
spring.sql.init.platform=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none

spring.liquibase.change-log=classpath:/db/changelog/changes/001-create-books-table.xml

spring.docker.compose.enabled=true
spring.docker.compose.lifecycle-management=start_only